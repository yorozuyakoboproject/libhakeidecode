<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111720">
<title data-i18n="app.title">Hakei · Logic Analyzer</title><script src="./preferences.js"></script><link rel="stylesheet" href="./styles.css">
</head>
<body class="workbench">
<header class="topbar">
<a class="brand" href="./"><svg viewBox="0 0 28 24" aria-hidden="true"><path d="M1 17h5V5h7v12h7V5h7"/></svg><span>HAKEI<span class="brand-sub">LOGIC ANALYZER</span></span></a>
<div class="capture-heading"><div><div class="eyebrow" data-i18n="capture.workspace">采样工作台</div><h1 id="capture-name" data-i18n="capture.empty">尚未采集</h1></div><div class="capture-metrics"><span><b id="sample-count">—</b><span data-i18n="capture.samples">采样点</span></span><span><b id="rate-label">—</b><span data-i18n="capture.rate">采样率</span></span><span><b id="duration-label">—</b><span data-i18n="capture.duration">总时长</span></span></div></div>
<div class="top-nav"><span class="nav-active" data-i18n="nav.workbench">工作台</span></div>
<span class="local-badge"><i></i><span data-i18n="nav.local">本地浏览器处理</span></span>
<div class="preferences">
<label class="preference-control"><span class="sr-only" data-i18n="theme.label">主题</span><select id="theme-mode" data-theme-select data-i18n-attrs="aria-label:theme.label"><option value="system" data-i18n="theme.system">跟随系统</option><option value="light" data-i18n="theme.light">日间</option><option value="dark" data-i18n="theme.dark">夜间</option></select></label>
<label class="preference-control"><span class="sr-only" data-i18n="locale.label">语言</span><select id="locale" data-locale-select data-i18n-attrs="aria-label:locale.label"><option value="zh-CN" lang="zh-CN">简体中文</option><option value="en" lang="en">English</option></select></label>
</div>
</header>
<div class="app-layout">
<aside class="sidebar">
<section class="side-section">
<div class="section-title"><span data-i18n="capture.section">采样数据</span><span class="section-number">01</span></div>
<form id="device-form">
<label class="field"><span data-i18n="device.select">采集设备</span><select id="device-select" data-i18n-attrs="aria-label:device.select"></select></label>
<div id="device-connection" hidden>
<div class="button-row"><button id="connect-device" type="button" class="button" data-i18n="device.connect">Connect USB</button><button id="disconnect-device" type="button" class="button subtle" data-i18n="device.disconnect">Disconnect</button></div>
<p id="device-connection-status" class="hint" role="status"></p>
</div>
<div id="device-sampling"></div>
<details id="device-settings" class="advanced"><summary data-i18n="device.settings">设备设置</summary><div id="device-options"></div></details>
<button id="run-capture" type="submit" class="button primary full" data-i18n="device.run">▶ 开始采集</button>
</form>
<details class="advanced"><summary data-i18n="capture.importSettings">二进制导入设置</summary>
<label class="field"><span data-i18n="capture.rate">采样率</span><span class="unit">Hz</span><input id="import-sample-rate" type="number" value="2000000" min="1" step="1" data-i18n-attrs="aria-label:capture.rateAria"></label>
<label class="field"><span data-i18n="capture.channels">二进制通道数</span><select id="import-channel-count"><option>4</option><option selected>8</option><option>16</option><option>32</option></select></label>
</details>
<button id="open-file" class="button full" data-i18n="capture.open">↥ 打开文件</button>
<input id="file-input" type="file" accept=".sr,.json,.bin,.raw,.dat" hidden><p class="hint" data-i18n="capture.hint">.sr 使用文件内采样率和通道信息；BIN 使用二进制导入设置，D0 为最低位。</p><button id="save-capture" class="text-button" disabled data-i18n="capture.save">↓ 保存 .sr 文件</button>
</section>
<section class="side-section"><div class="section-title"><span data-i18n="channels.section">数字通道</span><span id="channel-badge" class="section-number">0</span></div><div id="channel-list" class="channel-list"></div></section>
<section class="side-section decoder-section">
<div class="section-title"><span data-i18n="decoder.section">协议解码</span><span class="section-number">02</span></div>
<div class="protocol-add"><select id="add-decoder-type" data-i18n-attrs="aria-label:decoder.protocol"></select><button id="add-protocol" class="button" data-i18n="decoder.add">＋ 添加协议</button></div><div id="protocol-list" class="protocol-list" data-i18n-attrs="aria-label:decoder.instances"></div><p id="protocol-empty" class="hint" data-i18n="decoder.empty">添加协议以显示解码标注</p><div id="protocol-editor" hidden><div class="protocol-identity"><label class="field"><span data-i18n="decoder.name">名称</span><input id="protocol-name" maxlength="80" data-i18n-attrs="aria-label:decoder.name"></label><label class="field"><span data-i18n="decoder.color">颜色</span><input id="protocol-color" type="color" value="#70d7a1" data-i18n-attrs="aria-label:decoder.color"></label><button id="remove-protocol" class="icon-button" data-i18n-attrs="title:decoder.remove;aria-label:decoder.remove">×</button></div><label class="field"><span data-i18n="decoder.protocol">协议</span><select id="decoder-type" data-i18n-attrs="aria-label:decoder.protocol"></select></label>
<p id="protocol-description" class="hint"></p><form id="decoder-form"><div id="decoder-mapping" class="two-fields"></div><div id="decoder-options"></div><div id="decoder-display-options" hidden><label class="field"><span data-i18n="decoder.decimals">小数位数</span><select id="decoder-decimals" data-i18n-attrs="aria-label:decoder.decimals"><option>0</option><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></label></div><details id="decoder-advanced" class="advanced"><summary data-i18n="decoder.advanced">高级选项</summary><div id="advanced-options"></div></details></form><div class="protocol-exports"><span id="frame-count">0</span><span data-i18n="decoder.frames">帧</span><button id="export-csv" class="button compact">↓ CSV</button><select id="binary-output" data-i18n-attrs="aria-label:results.binaryOutput"></select><button id="export-binary" class="button compact">↓ BIN</button></div><div id="text-preview" class="protocol-preview"></div></div>
</section>
<footer class="sidebar-footer">libhakeidecode <span>0.3.0</span><br><span data-i18n="footer.summary">数字采样 · 协议解码 · 离线文件</span></footer>
</aside>
<main>
<div id="message" class="message" role="status" hidden></div>
<section class="wave-panel">
<div class="panel-toolbar"><span class="panel-title"><i class="green-dot"></i><span data-i18n="wave.title">数字波形</span></span><div class="toolbar-controls"><button id="zoom-out" class="icon-button" data-i18n-attrs="title:wave.zoomOut;aria-label:wave.zoomOut">−</button><button id="zoom-in" class="icon-button" data-i18n-attrs="title:wave.zoomIn;aria-label:wave.zoomIn">＋</button><button id="fit" class="button compact" data-i18n="wave.fit">全览</button><span class="divider"></span><button id="cursor-toggle" class="button compact" aria-pressed="false" data-i18n="wave.cursor">光标</button><button id="cursor-clear" class="icon-button" data-i18n-attrs="title:wave.clearCursors;aria-label:wave.clearCursors">×</button></div></div>
<div class="wave-scroll"><canvas id="time-axis" aria-hidden="true"></canvas><canvas id="waveform" data-i18n-attrs="aria-label:wave.aria"></canvas></div><div class="overview-wrap"><canvas id="overview" data-i18n-attrs="aria-label:wave.overviewAria"></canvas></div><div class="wave-footer"><span id="view-range">—</span><span id="cursor-measurement">滚轮缩放 · 任意位置拖动平移 · 点击光标后拖动测量区间</span></div>
</section>

<footer class="statusbar"><span id="status-text">准备就绪</span><span id="decode-state" class="sr-only" aria-live="polite">准备就绪</span><span id="memory-status">—</span><span id="capture-memory-usage">—</span><span id="render-status">—</span><button id="cancel" class="text-button" disabled data-i18n="action.cancel">取消任务</button></footer>
</main></div>
<script type="module" src="../dist/src/web/app.js"></script>
</body></html>
